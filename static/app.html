<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QuantJJ Dashboard Engine</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; }
    iframe { width: 100%; height: 100%; border: none; position: absolute; top:0; left:0; display: none; }
    iframe.active { display: block; }
    
    /* Splash screen while loading */
    #splash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #94a3b8; font-family: sans-serif;
      transition: opacity 0.5s;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(245,158,11,0.2);
      border-top-color: #f59e0b; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="spinner"></div>
    <h3>QuantJJ SPA Engine</h3>
    <p style="font-size: 0.8rem">載入並常駐所有核心模組中...</p>
  </div>

  <iframe id="frame-index" src="/_content/index?v=2"></iframe>
  <iframe id="frame-options" src="/_content/options?v=2"></iframe>
  <iframe id="frame-etf0050" src="/_content/etf0050?v=2"></iframe>
  <iframe id="frame-active_etf" src="/_content/active_etf?v=1"></iframe>
  <iframe id="frame-disposal" src="/_content/disposal?v=2"></iframe>
  <iframe id="frame-queue" src="/_content/queue?v=2"></iframe>
  <iframe id="frame-sector_heatmap" src="/_content/sector_heatmap?v=2"></iframe>

  <script>
    const frames = {
      '/': 'frame-index',
      '/options': 'frame-options',
      '/etf0050': 'frame-etf0050',
      '/active_etf': 'frame-active_etf',
      '/active-etf': 'frame-active_etf',
      '/disposal': 'frame-disposal',
      '/queue': 'frame-queue',
      '/sector_heatmap': 'frame-sector_heatmap'
    };
    
    function navigate(path) {
      if (!frames[path]) path = '/';
      Object.values(frames).forEach(id => document.getElementById(id).classList.remove('active'));
      document.getElementById(frames[path]).classList.add('active');
      if (window.location.pathname !== path) {
          window.history.pushState({}, "", path);
      }
    }
    
    window.addEventListener('message', e => {
      if (e.data && e.data.type === 'NAVIGATE') {
        navigate(e.data.path);
      }
    });

    window.addEventListener('popstate', () => {
      navigate(window.location.pathname);
    });

    // Remove splash screen after enough time for initial load
    setTimeout(() => {
        document.getElementById('splash').classList.add('hidden');
    }, 1500);

    navigate(window.location.pathname);
  </script>
</body>
</html>
