<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 選擇權報價看板 | Options Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0e1a;
            background-image:
                radial-gradient(ellipse at 10% 0%, rgba(99, 102, 241, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 100%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
            color: #e2e8f0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .container { max-width: 1600px; margin: 0 auto; padding: 30px 16px 60px; }

        /* === Header === */
        .page-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .page-header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .page-header p { color: #64748b; font-size: 0.95rem; }
        .page-header .nav-link {
            color: #818cf8;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid rgba(129,140,248,0.3);
            padding: 4px 14px;
            border-radius: 20px;
            transition: all 0.2s;
            display: inline-block;
            margin-top: 8px;
        }
        .page-header .nav-link:hover {
            background: rgba(129,140,248,0.15);
            border-color: rgba(129,140,248,0.6);
        }

        /* === Glass Card === */
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        /* === Search Bar === */
        .search-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            min-width: 160px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(100,116,139,0.3);
            color: #f1f5f9;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.2s;
        }
        .search-bar input:focus {
            border-color: rgba(56,189,248,0.7);
            box-shadow: 0 0 12px rgba(56,189,248,0.3);
        }
        .search-bar input::placeholder { color: #475569; }
        .search-bar .load-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .search-bar .load-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
        .search-bar .load-btn:disabled { opacity: 0.5; cursor: wait; transform: none; }

        /* Toggle buttons */
        .mode-toggle {
            display: flex;
            gap: 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(100,116,139,0.3);
        }
        .mode-toggle button {

            border: none;

        .mode-toggle button.active {

        /* Greeks toggle */

        .futures-ticker .left .name { color: #94a3b8; font-size: 0.85rem; margin-top: 2px; }
        .futures-ticker .left .meta { color: #64748b; font-size: 0.75rem; margin-top: 4px; }
        .futures-ticker .right { text-align: right; }

        /* Spot index */

        .spot-index .spot-price { font-size: 1.3rem; font-weight: 800; }

        /* === Options Chain Table === */
        .chain-wrapper {
            padding: 0;
            overflow-x: auto;
        }
        .chain-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;

        }
        .chain-table thead th {
            padding: 10px 4px;
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 2px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(15, 23, 42, 0.95);
            white-space: nowrap;
        }
        .chain-table thead th.call-header { color: #f87171; }
        .chain-table thead th.strike-header {
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.95);
        }
        .chain-table thead th.put-header { color: #4ade80; }
        /* Greek column headers */
        .chain-table thead th.call-greek-header {
            color: #f87171;
            opacity: 0.7;
            font-size: 0.62rem;
            border-right: 1px solid rgba(239,68,68,0.1);
        }
        .chain-table thead th.call-greek-header:first-child {

        }
        .chain-table thead th.put-greek-header {
            color: #4ade80;
            opacity: 0.7;

            border-left: 1px solid rgba(74,222,128,0.1);
        }

        .chain-table tbody td {
            padding: 8px 4px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.15s;

        .chain-table tbody tr:hover td { background: rgba(255,255,255,0.04); }

        /* Call side */
        .chain-table .call-price { font-weight: 700; font-size: 0.88rem; color: #fca5a5; }
        .chain-table .call-itm { background: rgba(239, 68, 68, 0.06); }

        /* Strike column */
        .chain-table .strike-cell {
            background: rgba(30, 41, 59, 0.5);
            font-weight: 700;
            font-size: 0.9rem;
            color: #cbd5e1;
            border-left: 1px solid rgba(255,255,255,0.06);
            border-right: 1px solid rgba(255,255,255,0.06);
            min-width: 72px;
        }

        /* Put side */
        .chain-table .put-price { font-weight: 700; font-size: 0.88rem; color: #86efac; }
        .chain-table .put-itm { background: rgba(34, 197, 94, 0.06); }

        /* ATM row */
        .chain-table .atm-row .strike-cell {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            box-shadow: inset 0 0 20px rgba(99,102,241,0.15);
            font-size: 1.05rem;
        }
        .chain-table .atm-row td {
            border-top: 1px solid rgba(99,102,241,0.3);
            border-bottom: 1px solid rgba(99,102,241,0.3);
        }

        /* Greek value cells */
        .greek-cell {
            font-size: 0.72rem !important;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .greek-cell.g-delta { color: #38bdf8; }
        .greek-cell.g-gamma { color: #a78bfa; }
        .greek-cell.g-vega { color: #34d399; }
        .greek-cell.g-theta { color: #fb923c; }
        .greek-cell.g-rho { color: #f472b6; }
        /* Divider between greeks and main data */
        .greek-border-r { border-right: 1px dashed rgba(255,255,255,0.08) !important; }
        .greek-border-l { border-left: 1px dashed rgba(255,255,255,0.08) !important; }

        /* Positive / Negative */
        .up { color: #ef4444; }
        .down { color: #22c55e; }
        .neutral { color: #64748b; }

        .volume-cell { color: #64748b; font-size: 0.75rem; }

        /* === Loading === */
        .loading-overlay { text-align: center; padding: 80px 20px; color: #64748b; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(99,102,241,0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 60px 20px; color: #475569; }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
        .error-msg { text-align: center; padding: 20px; color: #f87171; background: rgba(239,68,68,0.1); border-radius: 12px; margin: 20px; }

        /* === Auto-refresh indicator === */
        .refresh-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; font-size: 0.75rem; color: #475569;
            border-bottom: 1px solid rgba(255,255,255,0.04); margin-bottom: 8px;
        }
        .refresh-bar .dot {
            width: 8px; height: 8px; background: #10b981; border-radius: 50%;
            display: inline-block; margin-right: 6px; box-shadow: 0 0 6px #10b981;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        .no-data { color: #334155; font-style: italic; font-size: 0.75rem; }

        @media (max-width: 768px) {
            .chain-table { font-size: 0.68rem; }
            .chain-table thead th { padding: 8px 2px; font-size: 0.58rem; }
            .chain-table tbody td { padding: 6px 2px; }
            .futures-ticker { flex-direction: column; text-align: center; gap: 12px; }
            .futures-ticker .right { text-align: center; }
            .greek-cell { font-size: 0.62rem !important; }
        }
    </style>

<body>
<div class="container">

    <!-- Header -->
    <div class="page-header">
        <h1>Options Chain Live</h1>
        <p>選擇權報價看板 — 即時 Call / Put 報價 + Greeks 一覽</p>
        <div style="display:flex; justify-content:center; align-items:center; gap: 12px; margin-top: 8px;">
            <a href="/" class="nav-link" style="margin-top:0;">← 返回五檔掛單</a>
            <a href="/etf0050" class="nav-link" style="margin-top:0;color:#34d399;border-color:rgba(52,211,153,0.3);">💹 0050 iNAV</a>
            <a href="/queue" class="nav-a">⏱️ 多檔洗價排隊 ↗</a>
        <a href="/disposal" class="nav-link" style="margin-top:0;color:#f59e0b;border-color:rgba(245,158,11,0.3);">⚠️ 處置偵測</a>
            <div id="vixWidget" style="display:none; align-items:center; background:rgba(30,41,59,0.8); border:1px solid rgba(100,116,139,0.5); border-radius:20px; padding:4px 14px; font-size:0.85rem;"></div>
        </div>
    </div>

    <!-- Search -->
    <div class="glass search-bar">
        <input id="futInput" type="text" placeholder="輸入期貨代號 (例如 TXFD6)" value="TXFD6">
        <div class="mode-toggle">
            <button id="weeklyBtn" class="active" onclick="setMode(true)">周選</button>
            <button id="monthlyBtn" onclick="setMode(false)">月選</button>
        </div>
        <div class="mode-toggle">
            <button id="dayBtn" onclick="setNightMode(false)">日盤</button>
            <button id="nightBtn" onclick="setNightMode(true)">夜盤</button>
        </div>
        <div class="greeks-toggle active" id="greeksToggle" onclick="toggleGreeks()">
            <span>Σ</span> Greeks
        </div>
        <button id="loadBtn" class="load-btn" onclick="loadChain()">載入</button>
    </div>

    <!-- Futures Ticker -->
    <div id="futuresTicker" class="glass futures-ticker" style="display:none;">
        <div class="left">
            <div class="symbol" id="futSymbol">---</div>
            <div class="name" id="futName">---</div>
            <div class="meta" id="futMeta"></div>
        </div>
        <div class="right">
            <div class="price" id="futPrice">---</div>
            <div class="change" id="futChange">---</div>
        </div>
    </div>

    <!-- Spot Index -->
    <div id="spotTicker" class="glass" style="display:none; padding:0 28px 20px; margin-top:-12px; border-top:none; border-radius:0 0 16px 16px;">
        <div class="spot-index">
            <div class="label">🏦 台指現貨</div>
            <div class="spot-price" id="spotPrice">---</div>
            <div class="spot-change" id="spotChange">---</div>
            <div class="spot-basis" id="spotBasis"></div>
        </div>
    </div>

    <!-- Chain Container -->
    <div id="chainContainer" class="glass chain-wrapper">
        <div class="empty-state">
            <div class="icon">📊</div>
            <div>輸入期貨代號後按「載入」</div>
        </div>
    </div>

</div>

<script>
    let ws = null;
    let autoRefreshTimer = null;
    let currentFutSymbol = null;
    let isWeekly = true;
    let isNight = (new Date().getHours() >= 14 || new Date().getHours() < 8);
    let optionsData = null;
    let symbolMap = {};
    let renderTimer = null;
    let wsRetryCount = 0;
    let showGreeks = true;
    const WS_MAX_RETRIES = 8;
    const WS_BASE_DELAY = 5000;
    const WS_MAX_DELAY = 60000;

    // ═══════════════════════════════════════════════════════════════
    //  Black-76 Model: IV + Greeks Calculation
    // ═══════════════════════════════════════════════════════════════

    function normCDF(x) {
        let b1 =  0.319381530, b2 = -0.356563782, b3 =  1.781477937, b4 = -1.821255978, b5 =  1.330274429;
        let p  =  0.2316419, c  =  0.39894228;
        if(x >= 0.0) {
            let t = 1.0 / ( 1.0 + p * x );
            return (1.0 - c * Math.exp( -x * x / 2.0 ) * t * ( t *( t * ( t * ( t * b5 + b4 ) + b3 ) + b2 ) + b1 ));
        } else {
            let t = 1.0 / ( 1.0 - p * x );
            return ( c * Math.exp( -x * x / 2.0 ) * t * ( t *( t * ( t * ( t * b5 + b4 ) + b3 ) + b2 ) + b1 ));
        }
    }

    function normPDF(x) {
        return Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
    }

    function black76Price(isCall, F, K, T, v, r) {
        if (T <= 0 || v <= 0) return Math.max(0, isCall ? F - K : K - F);
        let d1 = (Math.log(F / K) + 0.5 * v * v * T) / (v * Math.sqrt(T));
        let d2 = d1 - v * Math.sqrt(T);
        let discount = Math.exp(-r * T);
        return discount * (isCall ? (F * normCDF(d1) - K * normCDF(d2)) : (K * normCDF(-d2) - F * normCDF(-d1)));
    }

    function calculateIV(isCall, targetPrice, F, K, T, r = 0.01) {
        if (T <= 0 || targetPrice == null || !F || !K) return null;

        let discount = Math.exp(-r * T);
        let intrinsic = isCall ? Math.max(0, (F - K) * discount) : Math.max(0, (K - F) * discount);

        if (targetPrice <= intrinsic) {
            return 0.0001;
        }

        let low = 0.0001;
        let high = 5.0;

        if (targetPrice > black76Price(isCall, F, K, T, high, r)) {
            return high;
        }

        let v = (low + high) / 2;
        for (let i = 0; i < 50; i++) {
            let p = black76Price(isCall, F, K, T, v, r);
            let diff = p - targetPrice;
            if (Math.abs(diff) < 1e-4) return v;
            if (diff > 0) { high = v; } else { low = v; }
            v = (low + high) / 2;
        }
        return v;
    }

    /**
     * Calculate all Greeks using Black-76 model.
     * Returns { delta, gamma, vega, theta, rho } — all rounded to 2dp for display.
     *  - vega: per 1% vol change
     *  - theta: per calendar day
     *  - rho: per 1% rate change
     */
    function calculateGreeks(isCall, F, K, T, sigma, r = 0.01) {
        if (T <= 0 || sigma == null || sigma <= 0.0001 || !F || !K) {
            return { delta: null, gamma: null, vega: null, theta: null, rho: null };
        }

        const sqrtT = Math.sqrt(T);
        const d1 = (Math.log(F / K) + 0.5 * sigma * sigma * T) / (sigma * sqrtT);
        const d2 = d1 - sigma * sqrtT;
        const discount = Math.exp(-r * T);
        const nd1 = normPDF(d1);

        // Delta
        const delta = isCall ? discount * normCDF(d1) : -discount * normCDF(-d1);

        // Gamma (same for call/put)
        const gamma = discount * nd1 / (F * sigma * sqrtT);

        // Vega (per 1% vol change → divide by 100)
        const vega = F * discount * nd1 * sqrtT / 100;

        // Theta (per calendar day → divide by 365)
        const price = black76Price(isCall, F, K, T, sigma, r);
        const thetaCanonical = isCall
            ? (-(F * discount * nd1 * sigma) / (2 * sqrtT) + r * (F * discount * normCDF(d1)) - r * (K * discount * normCDF(d2)))
            : (-(F * discount * nd1 * sigma) / (2 * sqrtT) - r * (F * discount * normCDF(-d1)) + r * (K * discount * normCDF(-d2)));
        const theta = thetaCanonical / 365;

        // Rho (per 1% rate change → divide by 100)
        const rho = -T * price / 100;

        return { delta, gamma, vega, theta, rho };
    }

    // ═══════════════════════════════════════════════════════════════

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('nightBtn').classList.toggle('active', isNight);
        document.getElementById('dayBtn').classList.toggle('active', !isNight);
    });

    document.getElementById('futInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loadChain();
    });

    function setMode(weekly) {
        isWeekly = weekly;
        document.getElementById('weeklyBtn').classList.toggle('active', weekly);
        document.getElementById('monthlyBtn').classList.toggle('active', !weekly);
        if (currentFutSymbol) loadChain();
    }

    function setNightMode(night) {
        if (isNight === night) return;
        isNight = night;
        document.getElementById('nightBtn').classList.toggle('active', night);
        document.getElementById('dayBtn').classList.toggle('active', !night);

        if (optionsData) {
            buildSymbolMap();

            if (isNight && optionsData.futuresClosePrice) {
                optionsData.futuresChange = optionsData.futuresPrice - optionsData.futuresClosePrice;
                optionsData.futuresChangePct = (optionsData.futuresChange / optionsData.futuresClosePrice) * 100;
            } else if (!isNight && optionsData.futuresPreviousClose) {
                optionsData.futuresChange = optionsData.futuresPrice - optionsData.futuresPreviousClose;
                optionsData.futuresChangePct = (optionsData.futuresChange / optionsData.futuresPreviousClose) * 100;
            }

            renderFuturesTicker(optionsData);
            renderChain(optionsData, true);

            if (ws) { ws.close(); ws = null; }
            setupWebSocket();
        } else if (currentFutSymbol) {
            loadChain();
        }
    }

    function toggleGreeks() {
        showGreeks = !showGreeks;
        document.getElementById('greeksToggle').classList.toggle('active', showGreeks);
        if (optionsData) {
            renderChain(optionsData, true);
        }
    }

    async function loadChain() {
        const sym = document.getElementById('futInput').value.trim().toUpperCase();
        if (!sym) return;

        currentFutSymbol = sym;
        const btn = document.getElementById('loadBtn');
        btn.disabled = true;
        btn.textContent = '載入中...';

        if (ws) { ws.close(); ws = null; }

        const modeLabel = isWeekly ? '周選' : '月選';
        const sessionLabel = isNight ? '夜盤' : '日盤';
        document.getElementById('chainContainer').innerHTML = `
            <div class="loading-overlay">
                <div class="spinner"></div>
                <div>正在載入 ${sym} ${modeLabel} (${sessionLabel})報價...</div>
                <div style="margin-top:8px;font-size:0.75rem;color:#475569">批次查詢約 70 個合約，約需 3-5 秒</div>
            </div>`;

        try {
            const res = await fetch(`/api/options-chain/${sym}?weekly=${isWeekly}&night=${isNight}`);
            const data = await res.json();

            if (data.error) {
                document.getElementById('chainContainer').innerHTML = `<div class="error-msg">❌ ${data.error}</div>`;
                btn.disabled = false;
                btn.textContent = '載入';
                return;
            }

            optionsData = data;
            buildSymbolMap();

            if (isNight && optionsData.futuresClosePrice) {
                optionsData.futuresChange = optionsData.futuresPrice - optionsData.futuresClosePrice;
                optionsData.futuresChangePct = (optionsData.futuresChange / optionsData.futuresClosePrice) * 100;
            }

            renderFuturesTicker(optionsData);
            renderChain(optionsData);
            setupWebSocket();

        } catch (e) {
            document.getElementById('chainContainer').innerHTML = `<div class="error-msg">❌ 連線失敗: ${e.message}</div>`;
        }

        btn.disabled = false;
        btn.textContent = '載入';
    }

    function buildSymbolMap() {
        symbolMap = {};
        const d = optionsData;

        const futRef = isNight ? d.futuresClosePrice : d.futuresPreviousClose;
        symbolMap[d.futuresSymbol] = { type: 'futures', refPrice: futRef };

        if (d.spot) {
            const spotRef = d.spot.previousClose != null ? d.spot.previousClose : (d.spot.price - d.spot.change);
            symbolMap[d.spot.symbol] = { type: 'spot', refPrice: spotRef };
        }

        d.chain.forEach(row => {
            if (row.call && row.call.symbol) {
                const callRef = isNight ? row.call.closePrice : row.call.previousClose;
                symbolMap[row.call.symbol] = { type: 'call', row: row, refPrice: callRef };
                if (callRef) {
                    row.call.change = row.call.lastPrice ? (row.call.lastPrice - callRef) : 0;
                    row.call.changePercent = (row.call.change / callRef) * 100;
                }
            }
            if (row.put && row.put.symbol) {
                const putRef = isNight ? row.put.closePrice : row.put.previousClose;
                symbolMap[row.put.symbol] = { type: 'put', row: row, refPrice: putRef };
                if (putRef) {
                    row.put.change = row.put.lastPrice ? (row.put.lastPrice - putRef) : 0;
                    row.put.changePercent = (row.put.change / putRef) * 100;
                }
            }
        });
    }

    function scheduleRender() {
        if (!renderTimer) {
            renderTimer = requestAnimationFrame(() => {
                if (optionsData) {
                    renderFuturesTicker(optionsData);
                    renderChain(optionsData, true);
                }
                renderTimer = null;
            });
        }
    }

    function setupWebSocket() {
        const symbolsToSub = Object.keys(symbolMap);
        if (symbolsToSub.length === 0) return;

        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${proto}//${window.location.host}/ws/${symbolsToSub.join(',')}?night=${isNight}`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            wsRetryCount = 0;
            console.log("WebSocket connected to", symbolsToSub.length, "symbols");
        };

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);

                if (msg.event === "vix_update" && msg.data) {
                    const v = msg.data;
                    const w = document.getElementById("vixWidget");
                    if(w && v.CLastPrice) {
                        window.latestVix = parseFloat(v.CLastPrice);
                        const price = window.latestVix.toFixed(2);
                        const diff = parseFloat(v.CDiff);
                        const diffStr = diff > 0 ? `▲${Math.abs(diff)}` : (diff < 0 ? `▼${Math.abs(diff)}` : `0.0`);
                        const colorClass = diff > 0 ? "text-red-400" : (diff < 0 ? "text-green-400" : "text-slate-400");
                        w.innerHTML = `<span style="color:#94a3b8;margin-right:6px">🇹🇼 TAIWAN VIX:</span><span style="color:white;font-weight:700;margin-right:6px">${price}</span><span class="${colorClass}">${diffStr}</span>`;
                        w.style.display = "flex";
                    }
                    return;
                }

                if ((msg.event === "data" || msg.event === "snapshot") && msg.data) {
                    const channel = msg.channel;
                    const d = msg.data;
                    const sym = d.symbol;
                    const mapInfo = symbolMap[sym];
                    if (!mapInfo) return;

                    let updated = false;

                    if (channel === "trades") {
                        let tradePrice = d.price;
                        if (tradePrice === undefined && Array.isArray(d.trades) && d.trades.length > 0) {
                            tradePrice = d.trades[d.trades.length - 1].price;
                        }
                        if (tradePrice === undefined && d.lastPrice !== undefined) tradePrice = d.lastPrice;
                        if (tradePrice === undefined && d.close !== undefined) tradePrice = d.close;
                        if (tradePrice === undefined && Array.isArray(d) && d.length > 0) tradePrice = d[0].price;

                        if (tradePrice !== undefined) {
                            const newChg = mapInfo.refPrice ? (tradePrice - mapInfo.refPrice) : 0;
                            const newPct = mapInfo.refPrice ? (newChg / mapInfo.refPrice) * 100 : 0;
                            const vol = d.volume || (Array.isArray(d.trades) && d.trades.length > 0 ? d.trades[d.trades.length - 1].volume : null);

                            if (mapInfo.type === 'futures') {
                                optionsData.futuresPrice = tradePrice;
                                optionsData.futuresChange = newChg;
                                optionsData.futuresChangePct = newPct;
                                updated = true;
                            } else if (mapInfo.type === 'spot') {
                                optionsData.spot.price = tradePrice;
                                optionsData.spot.change = newChg;
                                optionsData.spot.changePct = newPct;
                                updated = true;
                            } else if (mapInfo.type === 'call') {
                                mapInfo.row.call.lastPrice = tradePrice;
                                mapInfo.row.call.change = newChg;
                                mapInfo.row.call.changePercent = newPct;
                                if (vol != null) mapInfo.row.call.volume = vol;
                                updated = true;
                            } else if (mapInfo.type === 'put') {
                                mapInfo.row.put.lastPrice = tradePrice;
                                mapInfo.row.put.change = newChg;
                                mapInfo.row.put.changePercent = newPct;
                                if (vol != null) mapInfo.row.put.volume = vol;
                                updated = true;
                            }
                        }
                    } else if (channel === "books") {
                        const bids = d.bids || d.Bids || [];
                        const asks = d.asks || d.Asks || [];
                        const bestBid = bids.length > 0 ? bids[0].price : null;
                        const bestAsk = asks.length > 0 ? asks[0].price : null;

                        if (mapInfo.type === 'call') {
                            if (bestBid !== null) mapInfo.row.call.bidPrice = bestBid;
                            if (bestAsk !== null) mapInfo.row.call.askPrice = bestAsk;
                            updated = true;
                        } else if (mapInfo.type === 'put') {
                            if (bestBid !== null) mapInfo.row.put.bidPrice = bestBid;
                            if (bestAsk !== null) mapInfo.row.put.askPrice = bestAsk;
                            updated = true;
                        }
                    }

                    if (updated) { scheduleRender(); }
                }
            } catch(e) { /* ignore */ }
        };

        ws.onclose = () => {
            ws = null;
            if (optionsData && Object.keys(symbolMap).length > 0 && wsRetryCount < WS_MAX_RETRIES) {
                wsRetryCount++;
                const delay = Math.min(WS_BASE_DELAY * Math.pow(2, wsRetryCount - 1), WS_MAX_DELAY);
                console.log(`WebSocket disconnected, retry ${wsRetryCount}/${WS_MAX_RETRIES} in ${delay/1000}s...`);
                setTimeout(() => setupWebSocket(), delay);
            } else if (wsRetryCount >= WS_MAX_RETRIES) {
                console.log(`WebSocket: max retries (${WS_MAX_RETRIES}) reached, stopping.`);
                wsRetryCount = 0;
            }
        };
    }

    function renderFuturesTicker(data) {
        const ticker = document.getElementById('futuresTicker');
        ticker.style.display = 'flex';

        document.getElementById('futSymbol').textContent = data.futuresSymbol;
        document.getElementById('futName').textContent = data.futuresName;

        const modeLabel = data.weekly ? '周選' : '月選';
        const dteText = data.daysToExpiry === 0 ? '今日到期' : `${data.daysToExpiry} 天`;
        document.getElementById('futMeta').innerHTML =
            `<span>${modeLabel} | 產品: ${data.product} | Call: ${data.callMonth}${data.yearCode} / Put: ${data.putMonth}${data.yearCode}</span>` +
            `<span class="expiry-badge">📅 到期: ${data.expiryDate} <span class="dte">DTE ${dteText}</span></span>`;

        const priceEl = document.getElementById('futPrice');
        const changeEl = document.getElementById('futChange');
        const price = data.futuresPrice;
        const chg = data.futuresChange || 0;
        const pct = data.futuresChangePct || 0;

        priceEl.textContent = price.toLocaleString();

        if (chg > 0) {
            priceEl.className = 'price up';
            changeEl.className = 'change up';
            changeEl.textContent = `▲ ${Math.abs(chg)} (+${pct.toFixed(2)}%)`;
        } else if (chg < 0) {
            priceEl.className = 'price down';
            changeEl.className = 'change down';
            changeEl.textContent = `▼ ${Math.abs(chg)} (${pct.toFixed(2)}%)`;
        } else {
            priceEl.className = 'price neutral';
            changeEl.className = 'change neutral';
            changeEl.textContent = `0 (0.00%)`;
        }

        renderSpotIndex(data);
    }

    function renderSpotIndex(data) {
        const spotEl = document.getElementById('spotTicker');
        if (!data.spot || !data.spot.price) { spotEl.style.display = 'none'; return; }
        spotEl.style.display = 'block';

        const s = data.spot;
        const sp = document.getElementById('spotPrice');
        const sc = document.getElementById('spotChange');
        const sb = document.getElementById('spotBasis');

        sp.textContent = s.price.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});

        const chg = s.change || 0;
        const pct = s.changePct || 0;
        if (chg > 0) {
            sp.className = 'spot-price up'; sc.className = 'spot-change up';
            sc.textContent = `▲ ${Math.abs(chg).toFixed(2)} (+${pct.toFixed(2)}%)`;
        } else if (chg < 0) {
            sp.className = 'spot-price down'; sc.className = 'spot-change down';
            sc.textContent = `▼ ${Math.abs(chg).toFixed(2)} (${pct.toFixed(2)}%)`;
        } else {
            sp.className = 'spot-price neutral'; sc.className = 'spot-change neutral';
            sc.textContent = '0.00 (0.00%)';
        }

        const basis = data.futuresPrice - s.price;
        const basisSign = basis >= 0 ? '+' : '';
        sb.textContent = `正逆價差: ${basisSign}${basis.toFixed(2)}`;
    }

    // ═══════════════════════════════════════════════════════════════
    //  Render the Options Chain Table
    //  Layout (with Greeks ON):
    //    Call ρ | Call Θ | Call V | Call Γ | Call Δ | IV | Vol | Chg | % | Bid | Price | Ask
    //    ── STRIKE ──
    //    Bid | Price | Ask | Chg | % | Vol | IV | Put Δ | Put Γ | Put V | Put Θ | Put ρ
    // ═══════════════════════════════════════════════════════════════

    function renderChain(data, isRefresh = false) {
        const chain = data.chain;
        const center = data.centerStrike;
        const futPrice = data.futuresPrice;
        const T = Math.max(data.daysToExpiry / 365.0, 0.001);
        const F = data.futuresPrice;
        const r = 0.01;

        const now = new Date().toLocaleTimeString('zh-TW');
        const wsStatus = (typeof ws !== 'undefined' && ws && ws.readyState === 1);
        const refreshHtml = `<div class="refresh-bar">
            <div><span class="dot" style="background:${wsStatus?'#10b981':'#f59e0b'};box-shadow:0 0 6px ${wsStatus?'#10b981':'#f59e0b'}"></span> WebSocket 即時更新連線中</div>
            <div>初次擷取: ${now}</div>
        </div>`;

        let html = refreshHtml + `<table class="chain-table"><thead><tr>`;

        // CALL Greek headers (right-to-left: ρ Θ V Γ Δ)
        if (showGreeks) {
            html += `<th class="call-greek-header">ρ</th>`;
            html += `<th class="call-greek-header">Θ</th>`;
            html += `<th class="call-greek-header">V</th>`;
            html += `<th class="call-greek-header">Γ</th>`;
            html += `<th class="call-greek-header">Δ</th>`;
        }
        // CALL main headers
        html += `<th class="call-header">IV(%)</th>`;
        html += `<th class="call-header">成交量</th>`;
        html += `<th class="call-header">漲跌</th>`;
        html += `<th class="call-header">幅(%)</th>`;
        html += `<th class="call-header">買價</th>`;
        html += `<th class="call-header">最新價</th>`;
        html += `<th class="call-header">賣價</th>`;
        // STRIKE
        html += `<th class="strike-header">履約價</th>`;
        // PUT main headers
        html += `<th class="put-header">買價</th>`;
        html += `<th class="put-header">最新價</th>`;
        html += `<th class="put-header">賣價</th>`;
        html += `<th class="put-header">漲跌</th>`;
        html += `<th class="put-header">幅(%)</th>`;
        html += `<th class="put-header">成交量</th>`;
        html += `<th class="put-header">IV(%)</th>`;
        // PUT Greek headers (left-to-right: Δ Γ V Θ ρ)
        if (showGreeks) {
            html += `<th class="put-greek-header">Δ</th>`;
            html += `<th class="put-greek-header">Γ</th>`;
            html += `<th class="put-greek-header">V</th>`;
            html += `<th class="put-greek-header">Θ</th>`;
            html += `<th class="put-greek-header">ρ</th>`;
        }

        html += `</tr></thead><tbody>`;

        for (const row of chain) {
            const strike = row.strike;
            const isATM = strike === center;
            const callITM = strike < futPrice;
            const putITM = strike > futPrice;
            const rowClass = isATM ? 'atm-row' : '';

            const call = row.call || {};
            const put = row.put || {};

            const getPriceForIV = (opt) => {
                const lp = opt.lastPrice;
                const bid = opt.bidPrice;
                const ask = opt.askPrice;
                const vol = opt.volume || 0;
                const hasQuotes = bid != null && ask != null && bid > 0;
                const mid = hasQuotes ? (bid + ask) / 2 : null;
                const spread = hasQuotes ? (ask - bid) : 0;
                const isIlliquid = (vol < 10);
                const isWideSpread = hasQuotes && (spread >= 10 || spread / bid >= 0.1);
                if (lp == null || ((isIlliquid || isWideSpread) && mid != null)) { return mid; }
                return lp;
            };

            let callPrice = getPriceForIV(call);
            let putPrice = getPriceForIV(put);
            let callIV = callPrice != null ? calculateIV(true, callPrice, F, strike, T) : null;
            let putIV = putPrice != null ? calculateIV(false, putPrice, F, strike, T) : null;
            let callGreeks = calculateGreeks(true, F, strike, T, callIV, r);
            let putGreeks = calculateGreeks(false, F, strike, T, putIV, r);

            const callCellClass = callITM ? 'call-cell call-itm' : 'call-cell';
            const putCellClass = putITM ? 'put-cell put-itm' : 'put-cell';

            html += `<tr class="${rowClass}">`;

            // --- CALL Greeks (ρ Θ V Γ Δ) ---
            if (showGreeks) {
                html += greekTd(callGreeks.rho, 'g-rho', callCellClass);
                html += greekTd(callGreeks.theta, 'g-theta', callCellClass);
                html += greekTd(callGreeks.vega, 'g-vega', callCellClass);
                html += greekTd(callGreeks.gamma, 'g-gamma', callCellClass);
                html += greekTd(callGreeks.delta, 'g-delta', callCellClass, true); // border-right
            }

            // --- CALL main cells ---
            html += renderCallCells(call, callCellClass, callIV);

            // --- STRIKE ---
            html += `<td class="strike-cell">${strike.toLocaleString()}</td>`;

            // --- PUT main cells ---
            html += renderPutCells(put, putCellClass, putIV);

            // --- PUT Greeks (Δ Γ V Θ ρ) ---
            if (showGreeks) {
                html += greekTd(putGreeks.delta, 'g-delta', putCellClass, false, true); // border-left
                html += greekTd(putGreeks.gamma, 'g-gamma', putCellClass);
                html += greekTd(putGreeks.vega, 'g-vega', putCellClass);
                html += greekTd(putGreeks.theta, 'g-theta', putCellClass);
                html += greekTd(putGreeks.rho, 'g-rho', putCellClass);
            }

            html += `</tr>`;
        }

        html += `</tbody></table>`;
        document.getElementById('chainContainer').innerHTML = html;
    }

    function greekTd(val, colorClass, cellClass, borderR = false, borderL = false) {
        const cls = [cellClass, 'greek-cell', colorClass];
        if (borderR) cls.push('greek-border-r');
        if (borderL) cls.push('greek-border-l');
        const text = val != null ? val.toFixed(2) : '—';
        return `<td class="${cls.join(' ')}">${text}</td>`;
    }

    function renderCallCells(opt, cellClass, iv) {
        const lp = opt.lastPrice;
        const chg = opt.change;
        const pct = opt.changePercent;
        const vol = opt.volume;
        const bid = opt.bidPrice;
        const ask = opt.askPrice;

        const priceText = lp != null ? parseFloat(lp.toFixed(2)) : '<span class="no-data">—</span>';

        const cleanChg = chg != null ? parseFloat(chg.toFixed(4)) : null;
        const chgClass = cleanChg > 0 ? 'up' : cleanChg < 0 ? 'down' : 'neutral';

        let chgText = '—';
        let pctText = '—';
        if (cleanChg != null) {
            const sign = cleanChg > 0 ? '+' : '';
            chgText = `<span>${sign}${cleanChg}</span>`;
            if (pct != null && cleanChg !== 0) {
                pctText = `<span>${sign}${Math.abs(pct).toFixed(2)}%</span>`;
            } else if (cleanChg === 0) {
                pctText = `<span>0.00%</span>`;
            }
        }

        const volText = vol != null ? vol.toLocaleString() : '—';
        const bidText = bid != null ? parseFloat(bid.toFixed(2)) : '—';
        const askText = ask != null ? parseFloat(ask.toFixed(2)) : '—';

        let ivText = '<span class="no-data">—</span>';
        if (iv != null) {
            const ivPct = iv * 100;
            if (window.latestVix && (ivPct >= window.latestVix + 30)) {
                ivText = `<span style="color:#ef4444;font-weight:900;text-shadow:0 0 8px rgba(239,68,68,0.6)">🔥${(ivPct).toFixed(1)}%</span>`;
            } else {
                ivText = `<span style="color:#fbbf24;font-weight:600">${(ivPct).toFixed(1)}%</span>`;
            }
        }

        return `
            <td class="${cellClass}">${ivText}</td>
            <td class="${cellClass} volume-cell">${volText}</td>
            <td class="${cellClass} ${chgClass}" style="font-weight:600;font-size:0.75rem">${chgText}</td>
            <td class="${cellClass} ${chgClass}" style="font-size:0.7rem;opacity:0.85">${pctText}</td>
            <td class="${cellClass}" style="color:#94a3b8">${bidText}</td>
            <td class="${cellClass} call-price">${priceText}</td>
            <td class="${cellClass}" style="color:#94a3b8">${askText}</td>`;
    }

    function renderPutCells(opt, cellClass, iv) {
        const lp = opt.lastPrice;
        const chg = opt.change;
        const pct = opt.changePercent;
        const vol = opt.volume;
        const bid = opt.bidPrice;
        const ask = opt.askPrice;

        const priceText = lp != null ? parseFloat(lp.toFixed(2)) : '<span class="no-data">—</span>';

        const cleanChg = chg != null ? parseFloat(chg.toFixed(4)) : null;
        const chgClass = cleanChg > 0 ? 'up' : cleanChg < 0 ? 'down' : 'neutral';

        let chgText = '—';
        let pctText = '—';
        if (cleanChg != null) {
            const sign = cleanChg > 0 ? '+' : '';
            chgText = `<span>${sign}${cleanChg}</span>`;
            if (pct != null && cleanChg !== 0) {
                pctText = `<span>${sign}${Math.abs(pct).toFixed(2)}%</span>`;
            } else if (cleanChg === 0) {
                pctText = `<span>0.00%</span>`;
            }
        }

        const volText = vol != null ? vol.toLocaleString() : '—';
        const bidText = bid != null ? parseFloat(bid.toFixed(2)) : '—';
        const askText = ask != null ? parseFloat(ask.toFixed(2)) : '—';

        let ivText = '<span class="no-data">—</span>';
        if (iv != null) {
            const ivPct = iv * 100;
            if (window.latestVix && (ivPct >= window.latestVix + 30)) {
                ivText = `<span style="color:#ef4444;font-weight:900;text-shadow:0 0 8px rgba(239,68,68,0.6)">🔥${(ivPct).toFixed(1)}%</span>`;
            } else {
                ivText = `<span style="color:#fbbf24;font-weight:600">${(ivPct).toFixed(1)}%</span>`;
            }
        }

        return `
            <td class="${cellClass}" style="color:#94a3b8">${bidText}</td>
            <td class="${cellClass} put-price">${priceText}</td>
            <td class="${cellClass}" style="color:#94a3b8">${askText}</td>
            <td class="${cellClass} ${chgClass}" style="font-weight:600;font-size:0.75rem">${chgText}</td>
            <td class="${cellClass} ${chgClass}" style="font-size:0.7rem;opacity:0.85">${pctText}</td>
            <td class="${cellClass} volume-cell">${volText}</td>
            <td class="${cellClass}">${ivText}</td>`;
    }
</script>

<!-- SPA Engine Interceptor -->
<script>
    document.addEventListener('click', e => {
        const a = e.target.closest('a[href^="/"]');
        if (a && window.parent !== window) {
            e.preventDefault();
            window.parent.postMessage({type:'NAVIGATE', path: a.getAttribute('href')}, '*');
        }
    });
</script>
