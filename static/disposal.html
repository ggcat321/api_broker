<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>處置股票查詢</title>
    <meta name="description" content="TWSE / TPEx 公開處置股票查詢工具">
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.72);
            --panel-strong: rgba(30, 41, 59, 0.88);
            --line: rgba(148, 163, 184, 0.18);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --faint: #64748b;
            --amber: #f59e0b;
            --red: #ef4444;
            --green: #22c55e;
            --blue: #38bdf8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.13), transparent 28%),
                radial-gradient(circle at 80% 0%, rgba(245, 158, 11, 0.12), transparent 24%),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        }

        .container {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 48px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-end;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 22px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 4vw, 2.7rem);
            letter-spacing: 0;
        }

        .subtitle {
            color: var(--muted);
            margin: 0;
            line-height: 1.6;
        }

        .source-note {
            color: var(--faint);
            font-size: 0.82rem;
            text-align: right;
            line-height: 1.5;
        }

        .notice {
            display: none;
            border: 1px solid rgba(245, 158, 11, 0.26);
            background: rgba(245, 158, 11, 0.08);
            color: #fcd34d;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 0.86rem;
            line-height: 1.55;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .tab-btn, .filter-btn, .primary-btn {
            border: 1px solid var(--line);
            color: var(--muted);
            background: rgba(15, 23, 42, 0.55);
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.92rem;
        }

        .tab-btn.active, .filter-btn.active {
            color: #fff;
            border-color: rgba(245, 158, 11, 0.55);
            background: rgba(245, 158, 11, 0.16);
        }

        .primary-btn {
            color: #111827;
            border: 0;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            font-weight: 700;
        }

        .primary-btn:disabled {
            opacity: 0.62;
            cursor: not-allowed;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 18px 70px rgba(0, 0, 0, 0.22);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .section-title {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .count {
            color: var(--amber);
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .list-search {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .list-search input {
            min-width: min(100%, 280px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .card {
            border: 1px solid var(--line);
            border-left: 4px solid var(--amber);
            background: var(--panel-strong);
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            min-height: 152px;
        }

        .card.danger {
            border-left-color: var(--red);
        }

        .card:hover {
            border-color: rgba(245, 158, 11, 0.46);
        }

        .stock-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .stock-id {
            font-size: 1.25rem;
            font-weight: 850;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .stock-name {
            color: var(--muted);
            margin-left: 8px;
            font-size: 0.95rem;
        }

        .badge {
            border-radius: 999px;
            padding: 4px 8px;
            font-size: 0.72rem;
            font-weight: 800;
            background: rgba(56, 189, 248, 0.14);
            color: var(--blue);
            white-space: nowrap;
        }

        .badge.tpex {
            background: rgba(34, 197, 94, 0.14);
            color: #86efac;
        }

        .line {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.55;
            margin-top: 7px;
            overflow-wrap: anywhere;
        }

        .line.strong {
            color: #fbbf24;
        }

        .line.danger {
            color: #fca5a5;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            min-width: 180px;
            border: 1px solid var(--line);
            background: rgba(15, 23, 42, 0.72);
            color: var(--text);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: rgba(245, 158, 11, 0.62);
        }

        .status-box {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
            background: rgba(15, 23, 42, 0.52);
        }

        .status-box.safe {
            border-color: rgba(34, 197, 94, 0.28);
            background: rgba(34, 197, 94, 0.08);
        }

        .status-box.warn {
            border-color: rgba(245, 158, 11, 0.35);
            background: rgba(245, 158, 11, 0.09);
        }

        .empty, .loading, .error {
            text-align: center;
            color: var(--muted);
            padding: 40px 16px;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.35);
        }

        .error {
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.35);
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(245, 158, 11, 0.16);
            border-top-color: var(--amber);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @media (max-width: 720px) {
            .header {
                align-items: flex-start;
                flex-direction: column;
            }
            .source-note {
                text-align: left;
            }
            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<main class="container">
    <header class="header">
        <div>
            <h1>處置股票查詢</h1>
            <p class="subtitle">使用 TWSE / TPEx 公開資料查詢目前處置中的上市櫃股票。獨立版不需要券商 API 登入或憑證。</p>
        </div>
        <div class="source-note">
            資料來源：臺灣證券交易所、櫃買中心<br>
            <span id="fetch-time">尚未更新</span>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" id="tab-list" onclick="switchTab('list')">處置中清單</button>
        <button class="tab-btn" id="tab-query" onclick="switchTab('query')">單股查詢</button>
    </nav>

    <section class="tab-content active" id="content-list">
        <div class="panel">
            <div id="source-warning" class="notice"></div>
            <div class="toolbar">
                <div class="section-title">
                    <span>目前處置中的股票</span>
                    <span class="count" id="disposed-count">載入中</span>
                </div>
                <div class="filters">
                    <button class="filter-btn active" id="filter-all" onclick="renderDisposed('all')">全部</button>
                    <button class="filter-btn" id="filter-5" onclick="renderDisposed('5')">5 分鐘撮合</button>
                    <button class="filter-btn" id="filter-20" onclick="renderDisposed('20')">20 分鐘以上 / 停止買賣</button>
                    <button class="filter-btn" onclick="loadDisposed(true)">重新整理</button>
                </div>
            </div>
            <div class="list-search">
                <input id="list-search" type="search" placeholder="搜尋股票代號、名稱、處置條件或措施">
                <button class="filter-btn" id="clear-search" onclick="clearListSearch()" style="display:none">清除</button>
            </div>
            <div id="disposed-area" class="loading">
                <div class="spinner"></div>
                <div>正在查詢公開處置清單...</div>
            </div>
        </div>
    </section>

    <section class="tab-content" id="content-query">
        <div class="panel">
            <div class="search-box">
                <input id="stock-input" type="text" inputmode="numeric" maxlength="10" placeholder="輸入股票代號，例如 2330">
                <button class="primary-btn" id="query-btn" onclick="queryStock()">查詢</button>
            </div>
            <div id="query-result" class="empty">輸入股票代號後，可確認它是否在目前公開處置清單內。</div>
        </div>
    </section>
</main>

<script>
    let allDisposedData = [];
    let currentFilter = 'all';
    let listSearchTerm = '';

    const TWSE_URL = 'https://www.twse.com.tw/rwd/zh/announcement/punish?response=json';
    const TPEX_URL = 'https://www.tpex.org.tw/www/zh-tw/bulletin/disposal?response=json';

    function stripHtml(value) {
        const div = document.createElement('div');
        div.innerHTML = String(value || '');
        return div.textContent.replace(/\u00a0/g, ' ').trim();
    }

    function rocToAd(value) {
        if (!value) return '';
        return String(value).replace(
            /(^|[^\d])(\d{2,3})([/-])(\d{1,2})([/-])(\d{1,2})(?!\d)/g,
            (_, prefix, y, _sep1, m, _sep2, d) => `${prefix}${Number(y) + 1911}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`
        );
    }

    function convertPeriod(value) {
        if (!value) return '';
        return rocToAd(String(value).replace(/至/g, ' ~ ').replace(/-/g, ' ~ '));
    }

    function isPeriodActive(period) {
        if (!period) return true;
        const matches = [...String(period).matchAll(/(\d{4})[/-](\d{1,2})[/-](\d{1,2})/g)];
        if (!matches.length) return true;
        const today = new Date();
        const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const dates = matches.map(m => new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
        if (dates.some(d => Number.isNaN(d.getTime()))) return true;
        if (dates.length >= 2) {
            return new Date(Math.min(...dates)) <= todayDate && todayDate <= new Date(Math.max(...dates));
        }
        return todayDate <= dates[0];
    }

    function shortMeasure(value) {
        const text = stripHtml(value);
        const match = text.match(/(每\d+分鐘撮合一次)/);
        if (match) return `預收款券、人工管制撮合(${match[1]})`;
        return text ? text.slice(0, 120) : '';
    }

    function fieldIndex(fields, text, fallback) {
        const idx = (fields || []).findIndex(field => String(field).includes(text));
        return idx >= 0 ? idx : fallback;
    }

    function parseTwse(data) {
        const disposed = {};
        const fields = data.fields || [];
        const idxId = fieldIndex(fields, '代號', 2);
        const idxName = fieldIndex(fields, '名稱', 3);
        const idxCond = fieldIndex(fields, '條件', 5);
        const idxPeriod = fieldIndex(fields, '起迄', 6);
        const idxMeasure = fieldIndex(fields, '措施', 7);

        for (const row of data.data || []) {
            if (!Array.isArray(row) || row.length <= idxId) continue;
            const stockId = stripHtml(row[idxId]);
            if (!stockId || !stockId.slice(0, 4).match(/^\d{4}$/)) continue;
            const period = convertPeriod(stripHtml(row[idxPeriod] || ''));
            if (!isPeriodActive(period)) continue;
            disposed[stockId] = {
                name: stripHtml(row[idxName] || ''),
                period,
                condition: stripHtml(row[idxCond] || ''),
                measures: shortMeasure(row[idxMeasure] || ''),
                source: 'TWSE'
            };
        }
        return disposed;
    }

    function parseTpex(data) {
        const disposed = {};
        const rows = data?.tables?.[0]?.data || [];
        for (const row of rows) {
            if (!Array.isArray(row) || row.length < 8) continue;
            const stockId = stripHtml(row[2]);
            if (!stockId || !stockId.slice(0, 4).match(/^\d{4}$/)) continue;
            const period = convertPeriod(stripHtml(row[5] || ''));
            if (!isPeriodActive(period)) continue;
            const rawName = stripHtml(row[3]);
            disposed[stockId] = {
                name: rawName.includes('(') ? rawName.split('(')[0].trim() : rawName,
                period,
                condition: stripHtml(row[6] || '').replace(/\(.*?\)/g, '').slice(0, 80),
                measures: shortMeasure(row[7] || ''),
                source: 'TPEx'
            };
        }
        return disposed;
    }

    async function fetchJson(url, timeoutMs = 12000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } finally {
            clearTimeout(timer);
        }
    }

    async function fetchPublicDisposed() {
        const disposed = {};
        const errors = [];
        let twseOk = false;
        let tpexOk = false;

        try {
            Object.assign(disposed, parseTwse(await fetchJson(TWSE_URL)));
            twseOk = true;
        } catch (err) {
            errors.push(`TWSE：${err.message}`);
        }

        try {
            Object.assign(disposed, parseTpex(await fetchJson(TPEX_URL)));
            tpexOk = true;
        } catch (err) {
            errors.push('TPEx：瀏覽器阻擋櫃買中心跨來源資料，單檔模式可能只能顯示上市處置股。');
        }

        return {
            disposed,
            fetch_time: new Date().toLocaleString('zh-TW', { hour12: false }),
            sources: [
                twseOk ? 'TWSE' : null,
                tpexOk ? 'TPEx' : null
            ].filter(Boolean),
            errors
        };
    }

    async function fetchLocalApiFallback() {
        if (window.location.protocol === 'file:') return null;
        const res = await fetch('/api/disposal/disposed?refresh=true', { cache: 'no-store' });
        if (!res.ok) throw new Error(`Local API HTTP ${res.status}`);
        return await res.json();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        document.getElementById(`content-${tab}`).classList.add('active');
    }

    function isDanger(info) {
        const text = `${info.condition || ''} ${info.measures || ''}`;
        return text.includes('20分') || text.includes('45分') || text.includes('60分') || text.includes('停止買賣');
    }

    function sourceClass(source) {
        return String(source || '').toLowerCase() === 'tpex' ? 'tpex' : 'twse';
    }

    function setActiveFilter(mode) {
        currentFilter = mode;
        ['all', '5', '20'].forEach(key => {
            const el = document.getElementById(`filter-${key}`);
            if (el) el.classList.toggle('active', key === mode);
        });
    }

    async function loadDisposed(refresh = false) {
        const area = document.getElementById('disposed-area');
        area.className = 'loading';
        area.innerHTML = '<div class="spinner"></div><div>正在查詢公開處置清單...</div>';

        try {
            let data = await fetchPublicDisposed();
            if (!Object.keys(data.disposed || {}).length) {
                const fallback = await fetchLocalApiFallback();
                if (fallback) data = fallback;
            }
            if (data.error) throw new Error(data.error);

            allDisposedData = Object.entries(data.disposed || {}).sort((a, b) => a[0].localeCompare(b[0]));
            document.getElementById('fetch-time').textContent = data.fetch_time ? `更新時間：${data.fetch_time}` : '已更新';
            const warning = document.getElementById('source-warning');
            if (data.errors && (Array.isArray(data.errors) ? data.errors.length : Object.keys(data.errors).length)) {
                const msg = Array.isArray(data.errors) ? data.errors.join('<br>') : Object.values(data.errors).join('<br>');
                warning.innerHTML = msg;
                warning.style.display = 'block';
            } else {
                warning.style.display = 'none';
            }
            renderDisposed(currentFilter);
        } catch (err) {
            document.getElementById('disposed-count').textContent = '錯誤';
            area.className = 'error';
            area.innerHTML = `
                <div>查詢失敗：${err.message}</div>
                <div style="margin-top:10px;font-size:0.85rem;color:#94a3b8;line-height:1.6">
                    這個頁面不需要任何登入；請確認目前網路能連到 TWSE 公開網站。<br>
                    若公司網路阻擋跨來源資料，才需要改用 Launch_Disposal 啟動本機輔助 server。
                </div>`;
        }
    }

    function renderDisposed(mode = 'all') {
        setActiveFilter(mode);
        let rows = allDisposedData;
        if (mode === '5') {
            rows = rows.filter(([, info]) => {
                const text = `${info.condition || ''} ${info.measures || ''}`;
                return text.includes('5分') && !isDanger(info);
            });
        } else if (mode === '20') {
            rows = rows.filter(([, info]) => isDanger(info));
        }

        const term = listSearchTerm.trim().toLowerCase();
        if (term) {
            rows = rows.filter(([sid, info]) => {
                const haystack = [
                    sid,
                    info.name,
                    info.source,
                    info.period,
                    info.condition,
                    info.measures
                ].filter(Boolean).join(' ').toLowerCase();
                return haystack.includes(term);
            });
        }

        document.getElementById('disposed-count').textContent = `${rows.length} 檔`;
        const area = document.getElementById('disposed-area');

        if (!rows.length) {
            area.className = 'empty';
            area.textContent = term ? '沒有符合搜尋條件的處置股票。' : '目前沒有符合此篩選條件的處置股票。';
            return;
        }

        area.className = 'grid';
        area.innerHTML = rows.map(([sid, info]) => {
            const danger = isDanger(info);
            return `
                <article class="card ${danger ? 'danger' : ''}" onclick="quickQuery('${sid}')">
                    <div class="stock-row">
                        <div>
                            <span class="stock-id">${sid}</span>
                            <span class="stock-name">${info.name || ''}</span>
                        </div>
                        <span class="badge ${sourceClass(info.source)}">${info.source || ''}</span>
                    </div>
                    <div class="line">期間：${info.period || '未提供'}</div>
                    ${info.condition ? `<div class="line ${danger ? 'danger' : 'strong'}">條件：${info.condition}</div>` : ''}
                    ${info.measures ? `<div class="line">措施：${info.measures}</div>` : ''}
                </article>`;
        }).join('');
    }

    function clearListSearch() {
        const input = document.getElementById('list-search');
        input.value = '';
        listSearchTerm = '';
        document.getElementById('clear-search').style.display = 'none';
        renderDisposed(currentFilter);
        input.focus();
    }

    function quickQuery(sid) {
        document.getElementById('stock-input').value = sid;
        switchTab('query');
        queryStock();
    }

    async function queryStock() {
        const sid = document.getElementById('stock-input').value.trim();
        if (!sid) return;

        const btn = document.getElementById('query-btn');
        const result = document.getElementById('query-result');
        btn.disabled = true;
        btn.textContent = '查詢中...';
        result.className = 'loading';
        result.innerHTML = '<div class="spinner"></div><div>正在查詢...</div>';

        try {
            if (!allDisposedData.length) {
                await loadDisposed();
            }
            const match = allDisposedData.find(([stockId]) => stockId === sid);

            if (!match) {
                result.className = 'status-box safe';
                result.innerHTML = `
                    <div class="stock-id">${sid}</div>
                    <div class="line">目前不在公開處置清單內。</div>
                    <div class="line">資料來源：${[...new Set(allDisposedData.map(([, info]) => info.source).filter(Boolean))].join(' / ') || 'TWSE / TPEx'}</div>`;
                return;
            }

            const [stockId, info] = match;
            result.className = 'status-box warn';
            result.innerHTML = `
                <div class="stock-row">
                    <div>
                        <span class="stock-id">${stockId}</span>
                        <span class="stock-name">${info.name || ''}</span>
                    </div>
                    <span class="badge ${sourceClass(info.source)}">${info.source || ''}</span>
                </div>
                <div class="line">目前在公開處置清單內。</div>
                <div class="line">期間：${info.period || '未提供'}</div>
                ${info.condition ? `<div class="line strong">條件：${info.condition}</div>` : ''}
                ${info.measures ? `<div class="line">措施：${info.measures}</div>` : ''}`;
        } catch (err) {
            result.className = 'error';
            result.innerHTML = `
                <div>查詢失敗：${err.message}</div>
                <div style="margin-top:10px;font-size:0.85rem;color:#94a3b8;line-height:1.6">
                    這個查詢只使用目前頁面載入的公開處置清單，不需要任何登入。
                </div>`;
        } finally {
            btn.disabled = false;
            btn.textContent = '查詢';
        }
    }

    document.getElementById('list-search').addEventListener('input', event => {
        listSearchTerm = event.target.value;
        document.getElementById('clear-search').style.display = listSearchTerm.trim() ? 'inline-block' : 'none';
        renderDisposed(currentFilter);
    });

    document.getElementById('stock-input').addEventListener('keydown', event => {
        if (event.key === 'Enter') queryStock();
    });

    loadDisposed();
</script>
</body>
</html>
