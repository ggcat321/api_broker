<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排隊洗價監控器 | QuantJJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a; /* slate-900 */
            color: #f1f5f9;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .mono { font-family: 'SF Mono', 'Fira Code', monospace; }
        .g-cyan {
            background: linear-gradient(135deg, #22d3ee, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-a {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .nav-a:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .nav-a.active { background: rgba(34,211,238,0.15); border-color: rgba(34,211,238,0.4); color: #22d3ee; }
        
        .tracker-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .tracker-header {
            background: rgba(0,0,0,0.2);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .tracker-body { padding: 20px; }
        
        .btn-green { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #34d399; }
        .btn-green:hover { background: rgba(16,185,129,0.3); }
        .btn-red { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #f87171; }
        .btn-red:hover { background: rgba(239,68,68,0.3); }
        
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; }
        .dot-green { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .dot-yellow { background-color: #eab308; box-shadow: 0 0 8px #eab308; }
        .dot-red { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .dot-grey { background-color: #64748b; }
    </style>
</head>
<body class="p-6">

<div class="max-w-6xl mx-auto mb-7 flex flex-wrap items-center justify-between gap-4">
    <div>
        <h1 class="text-3xl font-black tracking-tight g-cyan">多股票排隊洗價監控器</h1>
        <p class="text-slate-500 text-sm mt-0.5">Multi-stock Order Queue ETA Tracker</p>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
        <a href="/" class="nav-a">📊 Order Book ↗</a>
        <a href="/options" class="nav-a">📈 選擇權 ↗</a>
        <a href="/etf0050" class="nav-a">💹 即時 iNAV ↗</a>
        <a href="/disposal" class="nav-a" style="color:#f59e0b;border-color:rgba(245,158,11,0.3)">⚠️ 處置偵測 ↗</a>
        <a href="/queue" class="nav-a active">⏱️ 多檔洗價排隊</a>
    </div>
</div>

<div class="max-w-6xl mx-auto mb-6">
    <div class="flex gap-2 bg-slate-800/80 p-4 rounded-xl border border-white/5 items-center">
        <input type="text" id="symbolInput" class="bg-slate-900 border border-white/10 rounded px-4 py-2 font-bold focus:outline-none focus:border-cyan-500 w-48 text-white placeholder-slate-500" placeholder="輸入股票代號 (如 2330)" maxlength="10" onkeypress="if(event.key === 'Enter') addTracker()">
        <button onclick="addTracker()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold px-6 py-2 rounded transition shadow-[0_0_15px_rgba(34,211,238,0.3)]">＋ 新增監控</button>
        <div class="text-slate-400 text-sm ml-4 border-l border-white/10 pl-4">每個方塊皆獨立建立 WebSocket 連線，支援多標的同時消耗計算。</div>
    </div>
</div>

<div class="max-w-6xl mx-auto" id="trackersContainer">
    <!-- Trackers will be injected here -->
</div>

<script>
    const fmt = (n, d=2) => n == null || isNaN(n) ? '--' : Number(n).toLocaleString('zh-TW', {minimumFractionDigits:d, maximumFractionDigits:d});
    
    // Structure: trackers[symbol] = { ws, simOrders, simOrderIdCounter, recentTrades, currentBook, lastBook, symbol }
    const trackers = {};

    // 嘗試還原 sessionStorage 快取
    try {
        const saved = sessionStorage.getItem('quant_trackers_state');
        if (saved) {
            const state = JSON.parse(saved);
            for (const sym of state.symbols) {
                createTracker(sym, state.data[sym]);
            }
        }
    } catch (e) { console.warn("恢復快取失敗", e); }

    function persistState() {
        const state = {
            symbols: Object.keys(trackers),
            data: {}
        };
        for (const [sym, t] of Object.entries(trackers)) {
            state.data[sym] = {
                simOrders: t.simOrders,
                simOrderIdCounter: t.simOrderIdCounter,
                recentTrades: t.recentTrades
            };
        }
        sessionStorage.setItem('quant_trackers_state', JSON.stringify(state));
    }
    window.addEventListener('beforeunload', persistState);

    setInterval(() => persistState(), 1000);

    setInterval(() => {
        for (const t of Object.values(trackers)) {
            if (t.simOrders.some(o => o.status === 'pending')) {
                renderSimOrders(t.symbol);
            }
        }
    }, 1000);

    function addTracker() {
        const input = document.getElementById('symbolInput');
        const sym = input.value.trim().toUpperCase();
        if (!sym) return;
        input.value = '';
        if (trackers[sym]) return alert(`標的 ${sym} 已經在監控列表中！`);
        createTracker(sym);
    }
    
    function removeTracker(sym) {
        if (!trackers[sym]) return;
        try { trackers[sym].ws.close(); } catch(e){}
        delete trackers[sym];
        document.getElementById(`tracker-${sym}`).remove();
    }

    function createTracker(sym, savedData = null) {
        trackers[sym] = {
            symbol: sym,
            simOrders: savedData ? savedData.simOrders : [],
            simOrderIdCounter: savedData ? savedData.simOrderIdCounter : 0,
            recentTrades: savedData ? savedData.recentTrades : [],
            currentBook: { bids: {}, asks: {} },
            lastPrice: null
        };
        
        const container = document.getElementById('trackersContainer');
        const div = document.createElement('div');
        div.id = `tracker-${sym}`;
        div.className = 'tracker-card';
        div.innerHTML = `
            <div class="tracker-header">
                <div class="flex items-center gap-3">
                    <span id="wsDot-${sym}" class="dot dot-yellow"></span>
                    <h2 class="text-xl font-black text-white tag-${sym}" style="letter-spacing:1px">${sym}</h2>
                    <span id="lastPrice-${sym}" class="mono font-bold text-lg text-slate-300 ml-4">--</span>
                </div>
                <button onclick="removeTracker('${sym}')" class="text-slate-500 hover:text-red-400 bg-white/5 hover:bg-white/10 rounded px-2 py-1 text-xs font-bold transition">✕ 關閉</button>
            </div>
            <div class="tracker-body grid grid-cols-[16rem_1fr] gap-6">
                
                <!-- Left: Order Book -->
                <div class="bg-black/30 rounded-xl border border-white/5 p-4 flex flex-col">
                    <div class="flex justify-between text-xs text-slate-500 font-bold mb-3 px-2">
                        <span>委買 (張)</span><span>委賣 (張)</span>
                    </div>
                    <div id="book-${sym}" class="flex-1">
                        <div class="text-slate-600 text-xs italic text-center py-6">等待五檔報價...</div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-white/5">
                        <button onclick="placeSimOrder('${sym}', 'bid')" class="btn-red py-2 rounded text-sm font-bold flex items-center justify-center gap-1">模擬買進 (跟單)</button>
                        <button onclick="placeSimOrder('${sym}', 'ask')" class="btn-green py-2 rounded text-sm font-bold flex items-center justify-center gap-1">模擬賣出 (跟單)</button>
                    </div>
                </div>

                <!-- Right: Tracker -->
                <div class="bg-black/20 rounded-xl border border-white/5 p-4 relative min-h-[200px]">
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-sm font-bold text-slate-400">委託洗價佇列 <span id="count-${sym}"></span></div>
                        <button onclick="clearCompletedOrders('${sym}')" id="clearBtn-${sym}" class="hidden text-slate-500 hover:text-slate-300 text-[10px] font-bold border border-white/10 rounded px-2 py-1 transition">清除已完成</button>
                    </div>
                    <div id="orders-${sym}" class="space-y-3">
                        <div class="text-slate-600 text-xs italic text-center py-8">目前沒有任何模擬委託單，請點擊左下方按鈕建立</div>
                    </div>
                </div>

            </div>
        `;
        
        // Insert at top
        container.insertBefore(div, container.firstChild);
        
        renderSimOrders(sym);
        connectWs(sym);
    }
    
    function normalizeSize(v) { return v == null ? 0 : (typeof v === 'number' ? v : parseInt(v, 10)); }

    function connectWs(sym) {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const url = `${proto}//${location.host}/ws/${sym}`;
        const ws = new WebSocket(url);
        trackers[sym].ws = ws;
        const dot = document.getElementById(`wsDot-${sym}`);

        ws.onopen = () => { dot.className = 'dot dot-green'; };
        ws.onclose = () => { dot.className = 'dot dot-red'; setTimeout(() => { if (trackers[sym]) connectWs(sym); }, 3000); };
        ws.onerror = () => { dot.className = 'dot dot-red'; };

        ws.onmessage = (event) => {
            let msg; try { msg = JSON.parse(event.data); } catch(e){ return; }
            if (msg.event === 'data' && msg.data) {
                const channel = msg.channel;
                const d = msg.data;
                const t = trackers[sym];
                
                if (channel === 'trades') {
                    const price = d.price !== undefined ? d.price : d.lastPrice;
                    let vol = 0;
                    if (Array.isArray(d.trades)) d.trades.forEach(tr => vol += (tr.size || tr.qty || 0));
                    else vol = d.size || d.qty || 0;
                    
                    if (price != null) {
                        t.lastPrice = price;
                        const el = document.getElementById(`lastPrice-${sym}`);
                        if (el) el.textContent = fmt(price, 2);
                    }
                    if (price != null && vol > 0) processTrade(sym, price, vol);
                } else if (channel === 'books') {
                    const bids = d.bids || d.Bids || [];
                    const asks = d.asks || d.Asks || [];
                    processBook(sym, bids, asks);
                }
            }
        };
    }

    function processBook(sym, bids, asks) {
        const t = trackers[sym];
        const newBids = {}; const newAsks = {};
        bids.forEach(b => { if(b.price) newBids[b.price] = normalizeSize(b.volume || b.size); });
        asks.forEach(a => { if(a.price) newAsks[a.price] = normalizeSize(a.volume || a.size); });

        t.simOrders.forEach(order => {
            if (order.status !== 'pending') return;
            const bookMap = order.side === 'bid' ? newBids : newAsks;
            const newVol = bookMap[order.price] || 0;
            
            if (newVol < order.Q) {
                const C = order.Q - newVol;
                const ratio = (order.Q > 0) ? (order.k / order.Q) : 0;
                order.k = Math.max(0, order.k - (C * ratio));
            }
            order.Q = newVol;
            order.outOfBounds = (newVol === 0 && Object.keys(bookMap).length > 0 && !bookMap[order.price]);
            if (order.k <= 0.5) { order.status = 'filled'; order.filledAt = Date.now(); order.k = 0; }
        });

        t.currentBook = { bids: newBids, asks: newAsks };
        renderSimOrders(sym);

        let html = '';
        for (let i = 0; i < 5; i++) {
            const b = bids[i]; const a = asks[i];
            const bv = b ? normalizeSize(b.volume || b.size) : '--';
            const av = a ? normalizeSize(a.volume || a.size) : '--';
            const bp = b && b.price != null ? fmt(b.price, 2) : '--';
            const ap = a && a.price != null ? fmt(a.price, 2) : '--';
            html += `<div class="grid grid-cols-2 text-center py-1 hover:bg-white/5 rounded">
                        <div><span class="text-red-400 font-bold">${bp}</span> <span class="text-slate-500 text-[10px] ml-1">(${bv})</span></div>
                        <div><span class="text-emerald-400 font-bold">${ap}</span> <span class="text-slate-500 text-[10px] ml-1">(${av})</span></div>
                     </div>`;
        }
        document.getElementById(`book-${sym}`).innerHTML = html;
    }

    function processTrade(sym, price, vol) {
        const t = trackers[sym];
        t.recentTrades.push({ price, vol, time: Date.now() });
        t.simOrders.forEach(order => {
            if (order.status !== 'pending' || order.price !== price) return;
            order.Q = Math.max(0, order.Q - vol);
            order.k = Math.max(0, order.k - vol);
            if (order.k <= 0) { order.status = 'filled'; order.filledAt = Date.now(); order.k = 0; }
        });
        renderSimOrders(sym);
    }

    function getBurnRate(sym, price) {
        const t = trackers[sym];
        const now = Date.now();
        t.recentTrades = t.recentTrades.filter(tr => now - tr.time <= 60000);
        const tradesAtPrice = t.recentTrades.filter(tr => tr.price === price);
        
        if (tradesAtPrice.length === 0) return { rate: 0, rawRate: 0, outliers: 0 };
        const totalVol = tradesAtPrice.reduce((sum, tr) => sum + tr.vol, 0);
        const elapsed = Math.min(60, (now - tradesAtPrice[0].time) / 1000) || 60;
        const rawRate = totalVol / elapsed;
        
        const vols = tradesAtPrice.map(tr => tr.vol).sort((a,b)=>a-b);
        const n = vols.length;
        if (n < 4) return { rate: rawRate, rawRate, outliers: 0 };
        const q1 = vols[Math.floor(n*0.25)]; const q3 = vols[Math.floor(n*0.75)];
        const upperFence = q3 + 1.5 * (q3 - q1);
        const filtered = vols.filter(v => v <= upperFence);
        return { rate: filtered.reduce((s,v)=>s+v,0) / elapsed, rawRate, outliers: n - filtered.length };
    }

    function placeSimOrder(sym, side) {
        const t = trackers[sym];
        const bestPrices = side === 'bid' ? t.currentBook.bids : t.currentBook.asks;
        const prices = Object.keys(bestPrices).map(p => parseFloat(p));
        if (prices.length === 0) return alert('目前無五檔報價！');
        const targetPrice = side === 'bid' ? Math.max(...prices) : Math.min(...prices);
        const currentVol = bestPrices[targetPrice] || 0;
        if (currentVol === 0) return alert('找不到目標價位掛單量');

        t.simOrders.unshift({
            id: ++t.simOrderIdCounter, side, price: targetPrice, initialQ: currentVol, Q: currentVol, k: currentVol, createdAt: Date.now(), status: 'pending', outOfBounds: false
        });
        renderSimOrders(sym);
    }

    function cancelSimOrder(sym, id) {
        const t = trackers[sym];
        const o = t.simOrders.find(x => x.id === id);
        if (o && o.status === 'pending') { o.status = 'canceled'; renderSimOrders(sym); }
    }
    function removeSimOrder(sym, id) {
        trackers[sym].simOrders = trackers[sym].simOrders.filter(o => o.id !== id);
        renderSimOrders(sym);
    }
    function clearCompletedOrders(sym) {
        trackers[sym].simOrders = trackers[sym].simOrders.filter(o => o.status === 'pending');
        renderSimOrders(sym);
    }

    function renderSimOrders(sym) {
        const t = trackers[sym];
        const container = document.getElementById(`orders-${sym}`);
        if (!container) return;
        if (t.simOrders.length === 0) {
            container.innerHTML = '<div class="text-slate-600 text-xs italic text-center py-8">目前沒有任何模擬委託單，請點擊左方選單買進或賣出</div>';
            document.getElementById(`count-${sym}`).textContent = '';
            document.getElementById(`clearBtn-${sym}`).classList.add('hidden');
            return;
        }

        let html = '';
        t.simOrders.forEach(o => {
            const sideColor = o.side === 'bid' ? 'text-red-400' : 'text-emerald-400';
            const sideLabel = o.side === 'bid' ? '買單' : '賣單';
            let bgClass = o.status === 'pending' ? 'bg-slate-900 border-slate-700/60 shadow-lg' : 'bg-slate-900/40 border-white/5 opacity-70';
            
            let statusBadge = '';
            if (o.status === 'filled') statusBadge = '<span class="text-emerald-400 border border-emerald-500/30 bg-emerald-500/10 px-2 py-0.5 rounded text-[10px]">✅ 已成交</span>';
            else if (o.status === 'canceled') statusBadge = '<span class="text-slate-400 border border-slate-500/30 bg-slate-500/10 px-2 py-0.5 rounded text-[10px]">已取消</span>';
            else if (o.outOfBounds) statusBadge = '<span class="text-amber-400 border border-amber-500/30 bg-amber-500/10 px-2 py-0.5 rounded text-[10px]">⚠️ 跌出範圍</span>';
            else statusBadge = '<span class="text-blue-400 border border-blue-500/30 bg-blue-500/10 px-2 py-0.5 rounded text-[10px] animate-pulse">⏳ 洗價中</span>';
            
            let pct = o.initialQ > 0 ? ((o.initialQ - o.k) / o.initialQ) * 100 : 100;
            pct = Math.max(0, Math.min(100, pct));
            if (o.status === 'filled') pct = 100;

            let rateStr = '--', etaStr = '--';
            if (o.status === 'pending') {
                const { rate, rawRate, outliers } = getBurnRate(sym, o.price);
                if (rate > 0) {
                    rateStr = rate.toFixed(1);
                    const s = o.k / rate;
                    if (s > 3600) etaStr = '> 1h';
                    else if (s > 60) etaStr = `${Math.floor(s/60)}m ${Math.floor(s%60)}s`;
                    else etaStr = `${Math.floor(s)}s`;
                } else etaStr = '不動如山';
            }

            const tf = new Date(o.createdAt).toLocaleTimeString('zh-TW', {hour12:false});

            html += `
            <div class="${bgClass} border rounded-lg p-3 transition-colors duration-300">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-white/5">
                    <div class="flex items-center gap-2">
                        <span class="${sideColor} font-black mono">${sideLabel} @ ${o.price}</span>
                        ${statusBadge}
                    </div>
                    <div class="flex gap-1">
                        ${o.status === 'pending' ? `<button onclick="cancelSimOrder('${sym}', ${o.id})" class="text-slate-500 hover:text-red-400 bg-white/5 hover:bg-white/10 rounded px-2 py-1 text-[10px] uppercase font-bold transition">✕ 刪單</button>` : ''}
                        ${o.status !== 'pending' ? `<button onclick="removeSimOrder('${sym}', ${o.id})" class="text-slate-600 hover:text-slate-400 rounded px-2 py-1 text-[10px] uppercase font-bold transition">移除</button>` : ''}
                    </div>
                </div>
                
                <div class="grid grid-cols-4 gap-2 text-center text-xs">
                    <div><div class="text-slate-500 text-[10px] mb-0.5 font-bold">送出時間</div><div class="mono text-slate-300 font-bold">${tf}</div></div>
                    <div><div class="text-slate-500 text-[10px] mb-0.5 font-bold">前方剩餘</div><div class="mono font-bold text-white">${Math.floor(o.k)}<span class="text-slate-500 font-normal text-[10px]">/${o.initialQ}</span></div></div>
                    <div><div class="text-slate-500 text-[10px] mb-0.5 font-bold">消耗速率</div><div class="mono text-blue-300 font-bold">${rateStr} <span class="text-slate-500 font-normal text-[9px]">張/s</span></div></div>
                    <div><div class="text-slate-500 text-[10px] mb-0.5 font-bold">預估 ETA</div><div class="mono text-emerald-400 font-bold">${etaStr}</div></div>
                </div>

                <div class="mt-3 flex items-center gap-2 bg-black/20 p-1.5 rounded text-xs">
                    <div class="flex-1 bg-slate-800 rounded-full h-2 overflow-hidden">
                        <div class="bg-gradient-to-r from-blue-500 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                    </div>
                    <span class="text-white font-bold mono w-8 text-right">${Math.floor(pct)}%</span>
                </div>
            </div>`;
        });
        container.innerHTML = html;

        const pCount = t.simOrders.filter(o => o.status === 'pending').length;
        document.getElementById(`count-${sym}`).textContent = `(${pCount} 追蹤中)`;
        document.getElementById(`clearBtn-${sym}`).classList.toggle('hidden', t.simOrders.length === pCount);
    }
</script>

<!-- SPA Engine Interceptor -->
<script>
    document.addEventListener('click', e => {
        const a = e.target.closest('a[href^="/"]');
        if (a && window.parent !== window) {
            e.preventDefault();
            window.parent.postMessage({type:'NAVIGATE', path: a.getAttribute('href')}, '*');
        }
    });
</script>
</body>

</html>
